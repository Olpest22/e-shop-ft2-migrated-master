services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./nodejsw2-master/base.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./nodejsw2-master
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:root@db:5432/mydb?schema=public
      SECRET_KEY: gdsf324dsfFdF_@8sdfgjh324io8dsaf874g3kj2asludasfiysdf63uiwiu
      PORT: 5000
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:5000
    depends_on:
      - backend

volumes:
  postgres_data: